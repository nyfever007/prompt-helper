svg{--ink:#34322e;--fill:#ecebe7;--soft:#86827a;--iris:#a9a59c;--white:#fbfaf8;--pupil:#2a2825;--hl:#ffffff;--brow:#57544e;--lip:#d3cec6;--nostril:#6f6b64;--hair:#9b968c;--strand:#5f5b54;--cloth:#d9d5cd;--ghost:#c4c0b8}

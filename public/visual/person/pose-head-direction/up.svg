path,circle{vector-effect:non-scaling-stroke}
.o{fill:var(--fill);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.f{fill:var(--fill)}
.l{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
